name: Scheduled maintenance

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEBUG: "False"
      SECRET_KEY: github-actions-maintenance-signs-nothing
      ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Django would fall back to a throwaway local SQLite file and this run would silently do nothing."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh exchange rates
        run: python manage.py fetch_exchange_rates
      - name: Prune expired tokens
        if: always()
        run: python manage.py prune_tokens
